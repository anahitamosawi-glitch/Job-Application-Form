<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job application form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Job application form</h1>
        <p class="subtitle">Please fill out the form below to apply for a position.</p>

        <form>
            <h2>Personal information</h2>

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter your address">
            </div>

            <h2>Job information</h2>

            <div class="form-group">
                <label for="position">Position applying for</label>
                <select id="position" name="position" required>
                    <option value="">Select a position</option>
                    <option value="web-developer">Web developer</option>
                    <option value="graphic-designer">Graphic designer</option>
                    <option value="ui-ux-designer">UI/UX designer</option>
                    <option value="marketing-specialist">Marketing specialist</option>
                </select>
            </div>

            <div class="form-group">
                <label>Employment type</label>
                <div class="radio-group">
                    <label><input type="radio" name="employment" value="full-time"> Full-time</label>
                    <label><input type="radio" name="employment" value="part-time"> Part-time</label>
                    <label><input type="radio" name="employment" value="internship"> Internship</label>
                </div>
            </div>

            <h2>Education</h2>

            <div class="form-group">
                <label for="education">Highest level of education</label>
                <select id="education" name="education">
                    <option value="">Select an option</option>
                    <option value="high-school">High school</option>
                    <option value="college">College</option>
                    <option value="bachelor">Bachelor's degree</option>
                    <option value="master">Master's degree</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <h2>Skills</h2>

            <div class="checkbox-group">
                <label><input type="checkbox" name="skills" value="html"> HTML</label>
                <label><input type="checkbox" name="skills" value="css"> CSS</label>
                <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
                <label><input type="checkbox" name="skills" value="graphic-design"> Graphic design</label>
                <label><input type="checkbox" name="skills" value="communication"> Communication</label>
            </div>

            <h2>Work experience</h2>

            <div class="form-group">
                <label for="experience">Tell us about your experience</label>
                <textarea id="experience" name="experience" rows="5" placeholder="Describe your previous work experience..."></textarea>
            </div>

            <h2>Additional information</h2>

            <div class="form-group">
                <label for="resume">Upload your resume</label>
                <input type="file" id="resume" name="resume">
            </div>

            <div class="form-group">
                <label for="message">Why should we hire you?</label>
                <textarea id="message" name="message" rows="5" placeholder="Write a short message about yourself..."></textarea>
            </div>

            <div class="button-group">
                <button type="submit">Submit application</button>
                <button type="reset" class="cancel-button">Cancel</button>
            </div>
        </form>
    </div>
</body>
</html>
